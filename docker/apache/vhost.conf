<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # The project ships a stock Laravel public/.htaccess front controller.
        AllowOverride All
        Require all granted
    </Directory>

    # public/storage is a symlink into storage/app/public (php artisan storage:link).
    # Apache will not traverse a symlink unless it is told to.
    <Directory /var/www/html/storage/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /dev/stderr

    # Log everything except the container healthcheck hitting /up.
    SetEnvIf Request_URI "^/up$" dontlog
    CustomLog /dev/stdout combined env=!dontlog
</VirtualHost>
