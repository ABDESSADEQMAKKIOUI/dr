<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Behind the nginx edge (docker-compose.prod.yml), requests arrive here over
    # plain HTTP with X-Forwarded-Proto: https. Setting HTTPS=on makes
    # Symfony's Request::isSecure() true, so Laravel builds https:// URLs —
    # no TrustProxies middleware and no application source change needed.
    #
    # With HTTPS=on and a Host header carrying no port, Symfony resolves the
    # port to 443, so generated URLs correctly omit it.
    #
    # Safe because this vhost is only reachable from the compose network and
    # from 127.0.0.1 on the host; it is never published to the internet.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    # Log and record the real client IP rather than the nginx container's.
    # The app writes request IPs to activity_logs.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 10.0.0.0/8
    RemoteIPInternalProxy 172.16.0.0/12
    RemoteIPInternalProxy 192.168.0.0/16

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        # The project ships a stock Laravel public/.htaccess front controller.
        AllowOverride All
        Require all granted
    </Directory>

    # public/storage is a symlink into storage/app/public (php artisan storage:link).
    # Apache will not traverse a symlink unless it is told to.
    <Directory /var/www/html/storage/app/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog /dev/stderr

    # Log everything except the container healthcheck hitting /up.
    SetEnvIf Request_URI "^/up$" dontlog
    CustomLog /dev/stdout combined env=!dontlog
</VirtualHost>
