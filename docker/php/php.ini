; SAFM demo — PHP runtime tuning.

memory_limit = 512M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000

; The ERP imports products and uploads logos/attachments.
upload_max_filesize = 32M
post_max_size = 40M

expose_php = Off
date.timezone = UTC

; Errors go to the container log, never to the browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code is baked into the image, so there is nothing to revalidate at runtime.
opcache.validate_timestamps = 0
