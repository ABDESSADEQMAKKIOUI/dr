# SAFM — base stack.
#
# ON ITS OWN this is the single-tenant demo, unchanged:
#
#   docker compose up -d --build
#   → http://localhost:8088/login   admin@admin.com / password
#
# Override the published port with APP_PORT, e.g. `APP_PORT=9000 docker compose up -d`.
#
# WITH docker-compose.prod.yml it becomes the multi-tenant SaaS platform: nginx
# on 80/443 serving the apex, admin.<root> and a vhost per tenant subdomain, a
# platform schema, and one ERP schema per customer. That overlay is what flips
# TENANCY_ENABLED to true; everything below stays valid in both modes.
#
# Two services only in the base file. No Redis (the app never needs it, and
# CacheService's Redis calls are reachable from exactly one admin page), no
# queue worker and no scheduler (QUEUE_CONNECTION is sync because this repo has
# no jobs table — and see the Octane/queue-worker risk: a persistent worker
# would inherit the previous job's tenant connection).

name: safm-demo

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # In SaaS mode this schema is NOT what the app connects to — the app uses
      # a sentinel that must not exist, and every real schema is created by the
      # provisioner. It is still created here so that flipping TENANCY_ENABLED
      # back to false gives a working single-tenant instance, and so that the
      # `safm` user has something to own.
      MYSQL_DATABASE: ${DB_DATABASE:-safm}
      MYSQL_USER: ${DB_USERNAME:-safm}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      # Consumed by docker/mysql/init/10-safm-grants.sh to create the
      # control-plane identity alongside the ERP one.
      PLATFORM_DB_USERNAME: ${PLATFORM_DB_USERNAME:-safmctl}
      PLATFORM_DB_PASSWORD: ${PLATFORM_DB_PASSWORD:-ctlsecret}
    volumes:
      - db_data:/var/lib/mysql
      # Runs once on first init. Creates the three-identity privilege split:
      # the ERP user (DML on safm\_%), the control-plane user (DML on
      # safmctl\_%), and root for DDL only.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # --silent so a failed ping does not spam the container log.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    image: safm-demo:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to loopback by default so that adding the production overlay (which
      # puts nginx on 80/443) never accidentally exposes Apache to the internet.
      # Set APP_BIND=0.0.0.0 to reach the local demo from another machine.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8088}:80"
    environment:
      APP_NAME: SAFM Demo
      APP_ENV: production
      # Left unset on purpose: the entrypoint generates a key on first boot and
      # persists it on the storage volume, so sessions survive a recreate.
      # Pin it here (APP_KEY: base64:...) if you want it fixed across volumes.
      APP_DEBUG: "false"
      # Must match the origin the demo is actually reached at. config/filesystems
      # builds the public disk's url as env('APP_URL').'/storage', and the
      # entrypoint caches config — so Storage::url() bakes this host in. Showing
      # the demo over a LAN IP or a tunnel? Set APP_URL to that origin:
      #   APP_URL=http://192.168.1.20:8088 docker compose up -d
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8088}}
      APP_TIMEZONE: Africa/Casablanca
      APP_LOCALE: fr
      LOG_LEVEL: warning

      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-safm}
      DB_USERNAME: ${DB_USERNAME:-safm}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      # Only read when TENANCY_ENABLED=true. Root is used ONLY by the
      # platform_admin / tenant_admin connections, for CREATE DATABASE, DROP
      # DATABASE and migrations — never to serve a request.
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}

      # ── Multi-tenancy ───────────────────────────────────────────────────────
      # false here so that plain `docker compose up -d` still gives the working
      # single-tenant demo documented above. docker-compose.prod.yml sets it to
      # true. Every value below is inert while it is false.
      TENANCY_ENABLED: ${TENANCY_ENABLED:-false}
      TENANCY_ROOT_DOMAIN: ${SAFM_SERVER_NAME:-facturation.cfpss.ma}
      # Left empty on purpose: the entrypoint derives admin.<root domain> from
      # the line above. Set SAFM_ADMIN_SERVER_NAME in .env only to override it.
      TENANCY_ADMIN_DOMAIN: ${SAFM_ADMIN_SERVER_NAME:-}
      TENANCY_DB_PREFIX: safm_
      # A schema that MUST NOT EXIST. It is what DB_DATABASE points at, so a
      # request that reaches the database without resolving its tenant dies with
      # SQLSTATE[HY000][1049] instead of quietly reading someone else's data.
      # Never point MYSQL_DATABASE at this name.
      TENANCY_SENTINEL_DATABASE: safm_unassigned
      # safmctl_, deliberately OUTSIDE the safm_ namespace the ERP user is
      # granted, so an SQLi in the ERP cannot reach operators or billing.
      PLATFORM_DB_DATABASE: ${PLATFORM_DB_DATABASE:-safmctl_platform}

      # TLS issuance is driven by the certbot service, which only exists in the
      # production overlay. "off" here means TenantProvisioner step 14 logs and
      # moves on instead of queueing requests nobody will ever drain.
      SAFM_CERT_ISSUANCE: ${SAFM_CERT_ISSUANCE:-off}

      # Single-tenant mode only. Set to "false" to get an empty instance with
      # only roles, permissions, settings and the admin account. In SaaS mode
      # demo content is a `tenant:provision` decision, not a boot-time one.
      DEMO_SEED: "true"
    volumes:
      # storage/ only. The application code is baked into the image on purpose:
      # bind-mounting the project from a Windows host breaks `artisan
      # storage:link` and makes storage/ ownership fight with www-data.
      - app_storage:/var/www/html/storage

volumes:
  db_data:
  app_storage:
